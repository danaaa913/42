[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "novacortex"
version = "14.0.0"
description = "NovaCortex - bilingual (Arabic/English) Yarmouk University Telegram assistant with RAG, guardrails and semantic caching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=20",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "httpx>=0.24",
    "requests>=2.28",
    "nltk>=3.8",
    "pdfplumber>=0.10",
    "rank-bm25>=0.2",
    "langchain-chroma>=0.1",
    "langchain-core>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-text-splitters>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "tqdm>=4.65",
]

[project.optional-dependencies]
scripts = [
    "beautifulsoup4>=4.12",
    "PyMuPDF>=1.23",
    "pandas>=2.0",
    "plotly>=5.0",
]
dev = [
    "pytest>=7",
]
hackathon = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "pdfplumber>=0.10",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "streamlit>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "mcp>=1.0",
]

[project.scripts]
novacortex = "novacortex.bot.handlers:main"
novacortex-hackathon = "hackathon_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
